spring.application.name=nextbus

springdoc.swagger-ui.tags-sorter=alpha

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:nextbus-gs-2026-chave-local-de-teste}
jwt.expiracao-minutos=720

spring.ai.openai.api-key=${OPENAI_API_KEY:nao-configurada}
sptrans.base-url=${SPTRANS_BASE_URL:https://api.olhovivo.sptrans.com.br/v2.1}
sptrans.token=${SPTRANS_TOKEN:}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
